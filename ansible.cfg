[defaults]
collections_path = ./collections
host_key_checking = False
# Deliberately left at the default callback so this runs on a bare ansible-core
# install with no extra collections.

[inventory]
# host_list is what lets test_connection.yml run with -i localhost,
enable_plugins = unofficial.helix_cmdb.cmdb, host_list, auto, yaml, ini
# Without this, a plugin error is reduced to "Unable to parse <file> as an
# inventory source" and the actual reason is hidden.  Leave it on.
unparsed_is_failed = True
